# Не даёт бесплатному проекту Supabase «Языки с нуля» уснуть.
#
# Free-план ставит проект на паузу после 7 дней без запросов (22.10.2026 так
# и случилось — все старые версии приложения показывали «Нет связи с
# сервером»). Раз в три дня делаем один REST-запрос — это считается
# активностью. Ключ anon (публичный, он и так внутри приложения) лежит в
# секрете репозитория SUPABASE_ANON_KEY.
#
# Второй шаг — пустой коммит в keepalive.txt: GitHub отключает расписание в
# публичном репозитории, если в нём 60 дней нет активности.
name: keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase ping
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://krukchlseuwtwqdtbsdp.supabase.co/rest/v1/app_config?select=key&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase ответил: $code"
          case "$code" in 200|401|404) ;; *) exit 1 ;; esac

      - name: Отметка активности репозитория
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > keepalive.txt
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "keepalive $(date -u +%F)" || exit 0
          git push
